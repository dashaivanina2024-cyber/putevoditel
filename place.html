<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Место · Путеводитель по Калуге</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="cover">
  <div class="place-page">
    <div class="place-hero" id="place-hero">
      <div class="place-hero-topbar">
        <a class="btn" id="back-btn" href="index.html">← Назад</a>
      </div>
      <img id="place-photo" src="" alt="" style="display:none">
    </div>
    <main class="place-main fade">
      <div class="card-tag" id="place-section"></div>
      <h1 id="place-name"></h1>
      <div id="place-audio"></div>
      <p id="place-text-1"></p>
      <p id="place-text-2"></p>
      <dl class="facts" id="place-facts">
        <div><dt>Адрес</dt><dd id="place-address"></dd></div>
        <div><dt>Время работы</dt><dd id="place-hours"></dd></div>
        <div><dt>Осмотр</dt><dd id="place-visit"></dd></div>
      </dl>
      <a class="btn" id="place-route" target="_blank" rel="noopener">Проложить маршрут ↗</a>
      <div class="route-map place-route-map" id="place-route-map" style="display:none"></div>
      <div class="route-line-note" id="place-route-note" style="display:none"></div>
      <div class="place-switch">
        <a id="place-prev-link">‹ Предыдущее место</a>
        <a id="place-next-link">Следующее место ›</a>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data/places.js"></script>
  <script src="js/poi.js"></script>
  <script src="js/routing.js"></script>
  <script src="js/audio.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const place = PLACES.find((p) => p.id === id) || PLACES[0];
    const same = PLACES.filter((p) => p.section === place.section);
    const idx = same.indexOf(place);
    const section = SECTIONS.find((s) => s.id === place.section);

    document.body.dataset.theme = place.section;
    document.body.style.background = "var(--bg)";
    document.title = place.name + " · Путеводитель по Калуге";

    document.getElementById("place-section").textContent =
      (section ? section.page + " · " : "") + (idx + 1) + " из " + same.length;
    document.getElementById("place-name").textContent = place.name;
    document.getElementById("place-audio").appendChild(AudioGuideButton(place));

    const img = document.getElementById("place-photo");
    if (place.photo) { img.src = place.photo; img.alt = place.name; img.style.display = ""; }
    else document.getElementById("place-hero").classList.add("no-photo");

    document.getElementById("place-text-1").textContent = place.text;
    document.getElementById("place-text-2").textContent = place.text2;
    document.getElementById("place-address").textContent = place.address;
    document.getElementById("place-hours").textContent = place.hours;
    document.getElementById("place-visit").textContent = place.visit;
    document.getElementById("place-route").href =
      "https://yandex.ru/maps/?rtext=" + place.lon + "," + place.lat + "&rtt=mt";

    /* «Проложить маршрут»: строим уличный маршрут «вы — место» и показываем карту здесь */
    const routeBtn = document.getElementById("place-route");
    routeBtn.addEventListener("click", (e) => {
      if (routeBtn.dataset.busy) return;
      e.preventDefault();
      routeBtn.dataset.busy = "1";
      const old = routeBtn.textContent;
      routeBtn.textContent = "Строим маршрут…";
      const mapDiv = document.getElementById("place-route-map");
      const note = document.getElementById("place-route-note");
      Routing.userLocation()
        .then((from) => {
          const profile = Routing.distKm({ lat: from[0], lon: from[1] }, place) > 25 ? "driving" : "foot";
          if (window._routeMap) { window._routeMap.remove(); window._routeMap = null; }
          mapDiv.style.display = "";
          mapDiv.innerHTML = "";
          const map = L.map(mapDiv, { scrollWheelZoom: false });
          window._routeMap = map; /* для мобилки: refresh после layout */
          makeTiles(map);
          return Routing.drawStreet(map, [{ lat: from[0], lon: from[1] }, place], null, profile);
        })
        .then((res) => {
          const km = (res.distance / 1000).toFixed(1).replace(".", ",");
          const min = Math.max(1, Math.round(res.duration / 60));
          note.textContent = "От вас до «" + place.name + "»: " + km + " км, около " + min + " мин. Оранжевый пунктир — уличный маршрут от вашего положения.";
          note.style.display = "";
          routeBtn.textContent = "Маршрут на карте ✓";
          setTimeout(() => { routeBtn.textContent = "Обновить маршрут ↗"; }, 2200);
        })
        .catch((err) => {
          note.textContent = "Не получилось построить маршрут (" + (err && err.message ? err.message : "сеть") + "). Открываю Яндекс.Карты ↗";
          note.style.display = "";
          window.open(routeBtn.href, "_blank", "noopener");
          setTimeout(() => { routeBtn.textContent = old; }, 1800);
        })
        .finally(() => { delete routeBtn.dataset.busy; });
    });

    const prev = same[(idx - 1 + same.length) % same.length];
    const next = same[(idx + 1) % same.length];
    document.getElementById("place-prev-link").href = "place.html?id=" + prev.id;
    document.getElementById("place-prev-link").textContent = "‹ " + prev.name;
    document.getElementById("place-next-link").href = "place.html?id=" + next.id;
    document.getElementById("place-next-link").textContent = next.name + " ›";
    document.getElementById("back-btn").href = section ? section.file : "index.html";
  </script>
  <script src="js/main.js"></script>
</body>
</html>
